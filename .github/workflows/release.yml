name: Release

# Builds release binaries on GitHub's infrastructure from the pushed tag and attaches them to a
# GitHub Release. Releases are reproducible from the tagged commit — a prerequisite for code
# signing via SignPath Foundation (signing step to be added once the application is approved).
#
# Release candidates (spec §13): a tag of the form vX.Y.Z-rc.N is published as a PRE-RELEASE, so
# GitHub keeps it out of /releases/latest and the update check (§10) never offers it to ordinary
# users. The suffix is stamped into the binary's version — a tester has to be able to say which
# candidate they are running — but is stripped everywhere else: <Version> in the project, the
# installer's version fields (Inno needs a numeric one) and the asset names all stay X.Y.Z. Only
# the release title carries the full tag.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version from the tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $full = $tag -replace '^v', ''          # 0.8.2-rc.1 — what About must show
          $base = $full -replace '-.*$', ''       # 0.8.2      — everything else
          $isRc = $full -ne $base

          # The project's <Version> is the single source of truth (spec §12). Compare it against
          # the BASE version: comparing the whole tag is what broke the first rc on macOS.
          $project = ([xml](Get-Content src/Voica/Voica.csproj)).Project.PropertyGroup.Version |
                     Where-Object { $_ } | Select-Object -First 1
          if ($project -ne $base) {
            throw "tag $tag does not match <Version> in Voica.csproj ($project); expected v$project or v$project-rc.N"
          }

          "full=$full"   >> $env:GITHUB_OUTPUT
          "base=$base"   >> $env:GITHUB_OUTPUT
          "isRc=$($isRc.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "tag $tag -> version $full (base $base, pre-release: $isRc)"

      # -p:InformationalVersion is what AppInfo.Version reads, so a candidate says "0.8.2-rc.1" in
      # About while the assembly version stays numeric (spec §13).
      - name: Publish self-contained (compressed single file)
        run: dotnet publish src/Voica/Voica.csproj -c Release -p:PublishSingleFile=true -p:InformationalVersion=${{ steps.version.outputs.full }} -o out/self

      - name: Publish framework-dependent (small, needs .NET 8 Desktop Runtime)
        run: dotnet publish src/Voica/Voica.csproj -c Release -p:PublishSingleFile=true -p:SelfContained=false -p:InformationalVersion=${{ steps.version.outputs.full }} -o out/fx

      - name: Self-test both binaries
        shell: pwsh
        run: |
          $env:GROQ_API_KEY = $null
          foreach ($exe in @("out/self/Voica.exe", "out/fx/Voica.exe")) {
            $kind = Split-Path (Split-Path $exe -Parent) -Leaf
            $env:VOICETRANSLATE_TEST_DATA = Join-Path $env:RUNNER_TEMP "voice-translate-$kind/VoiceTranslate"
            New-Item -ItemType Directory -Force $env:VOICETRANSLATE_TEST_DATA | Out-Null
            $p = Start-Process -FilePath $exe -ArgumentList "--test-all" -Wait -PassThru -NoNewWindow
            Write-Host "$exe --test-all exit=$($p.ExitCode)"
            if ($p.ExitCode -ne 0) { exit 1 }
          }

      - name: Package licensed portable distributions
        shell: pwsh
        run: ./scripts/package-release.ps1 -Version "${{ steps.version.outputs.base }}"

      - name: Build installer
        shell: pwsh
        run: |
          # Match the installer-engine version whose license is vendored in licenses/components.json.
          choco install innosetup --version=6.7.4 -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup *", "C:\Program Files\Inno Setup *" `
                    -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
                  Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }
          Write-Host "compiler: $($iscc.FullName)"
          # The base version, not the tag: VersionInfoVersion only accepts numbers (spec §13).
          $compilerOutput = & $iscc.FullName /DAppVersion=${{ steps.version.outputs.base }} installer\voica.iss 2>&1
          $compilerExit = $LASTEXITCODE
          $compilerOutput | Write-Output
          if ($compilerExit -ne 0) { exit 1 }
          if (-not ($compilerOutput -match '^Compiler engine version: Inno Setup 6\.7\.4$')) {
            throw "Compiler engine differs from the vendored Inno Setup license inventory"
          }

      - name: Stage assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/assets | Out-Null
          $version = "${{ steps.version.outputs.base }}"
          Copy-Item "out/installer/VoiceTranslate-Setup-$version.exe" out/assets/
          # A missing asset must fail the job here: Copy-Item alone would only write an error and
          # the release would be published without the installer.
          foreach ($name in @("VoiceTranslate-$version-win-x64.zip", "VoiceTranslate-$version-win-x64-fx.zip", "VoiceTranslate-Setup-$version.exe")) {
            if (-not (Test-Path "out/assets/$name")) { throw "missing release asset: $name" }
          }
          Get-ChildItem out/assets | Select-Object Name, Length

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = "${{ steps.version.outputs.base }}"
          # Notes for the candidate if they exist, otherwise the ones for the release it is aiming
          # at: rc.1 and the final describe the same change.
          $notes = @(".github/release-notes/$tag.md", ".github/release-notes/v$version.md") |
                   Where-Object { Test-Path $_ } | Select-Object -First 1
          $cliArgs = @("release", "create", $tag,
                       "out/assets/VoiceTranslate-Setup-$version.exe",
                       "out/assets/VoiceTranslate-$version-win-x64.zip", "out/assets/VoiceTranslate-$version-win-x64-fx.zip",
                       "--title", "Voice Translate $tag")
          if ($notes) { $cliArgs += @("--notes-file", $notes) }
          else { $cliArgs += "--generate-notes" }
          # A candidate must never become /releases/latest — that is the whole mechanism that keeps
          # it away from ordinary users (spec §13).
          if ("${{ steps.version.outputs.isRc }}" -eq "true") { $cliArgs += "--prerelease" }
          gh @cliArgs
